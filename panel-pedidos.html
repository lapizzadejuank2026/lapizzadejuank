<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de pedidos | La Pizza de Juan K</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #121212; color: #fff; }
    header { padding: 22px 16px; background: #a71919; text-align: center; }
    h1 { margin: 0; font-size: 25px; }
    main { max-width: 850px; padding: 20px 16px; margin: auto; }
    .caja, .pedido { background: #252525; border-radius: 14px; padding: 19px; margin: 14px 0; }
    input, button { width: 100%; padding: 13px; margin: 7px 0; border: 0; border-radius: 9px; font-size: 16px; }
    input { background: white; color: #111; }
    button { background: #f6bd42; color: #171717; font-weight: bold; cursor: pointer; }
    button.secundario { background: #eee; }
    .alerta { color: #ffd16b; font-weight: bold; }
    .dato { margin: 8px 0; overflow-wrap: anywhere; }
    .productos { white-space: pre-wrap; overflow-wrap: anywhere; background: #181818; padding: 12px; border-radius: 8px; }
    .nuevo { border: 2px solid #f6bd42; }
    [hidden] { display: none !important; }
    .tabs { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin:0 0 18px; position:sticky; top:0; z-index:5; padding:10px 0; background:#121212; }
    .tabs button { margin:0; background:#292929; color:#f2f2f2; border:1px solid #484848; text-align:center; padding:14px 8px; font-size:15px; }
    .tabs button[aria-selected="true"] { color:#1b1410; background:#f6bd42; border-color:#f6bd42; }
    .tabs .cantidad { display:inline-block; border-radius:20px; padding:2px 7px; background:#a71919; color:white; font-size:12px; margin-left:4px; min-width:23px; }
    .resumen { font-size:14px; color:#e1e1e1; margin:10px 0 5px; }
    .resumen strong { color:#f6bd42; }
    .seccion-titulo { font-size:21px; margin:10px 0 4px; }
    .hint { color:#c8c8c8; font-size:14px; line-height:1.45; }
    #marco-productos { display:block; width:100%; height:1100px; border:0; border-radius:13px; background:#111; }
    button:focus-visible { outline:3px solid #fff; outline-offset:2px; }
    @media(max-width:520px) { header{padding:18px 12px} h1{font-size:23px} main{padding:10px 10px 24px} .caja,.pedido{padding:15px} .tabs{gap:6px} .tabs button{font-size:14px;padding:14px 5px} }
  </style>
</head>
<body>
<header><h1>🍕 La Pizza de Juan K</h1><div>Centro de control · Pedidos y productos</div></header>
<main>
  <section id="acceso" class="caja">
    <h2>Acceso del negocio</h2>
    <form id="formulario">
      <input id="correo" type="email" placeholder="Correo del administrador" autocomplete="username" required>
      <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button type="submit">Entrar al panel</button>
    </form>
    <p id="errorAcceso" class="alerta" role="alert"></p>
  </section>

  <section id="panel" hidden>
    <nav class="tabs" aria-label="Secciones del administrador">
      <button id="tab-pedidos" type="button" role="tab" aria-controls="vista-pedidos" aria-selected="true">🔔 Pedidos <span id="nuevos-tab" class="cantidad" hidden>0</span></button>
      <button id="tab-productos" type="button" role="tab" aria-controls="vista-productos" aria-selected="false">📦 Productos</button>
    </nav>
    <section id="vista-pedidos" role="tabpanel" aria-labelledby="tab-pedidos">
    <div class="caja">
      <p id="usuario"></p>
      <button id="activar">🔔 Activar alarma sonora</button>
      <button id="salir" class="secundario">Cerrar sesión</button>
      <p id="estado" class="alerta" role="status">Conectando con Firestore...</p>
      <p id="contador"></p>
    </div>
    <div id="lista"></div>
    </section>
    <section id="vista-productos" role="tabpanel" aria-labelledby="tab-productos" hidden>
      <div class="caja">
        <h2 class="seccion-titulo">📦 Administrar productos</h2>
        <p class="hint">Agrega productos, cambia precios, organiza categorías y administra fotografías. La recepción y su alarma siguen activas mientras trabajas aquí.</p>
      </div>
      <iframe id="marco-productos" title="Editor de productos" loading="lazy"></iframe>
    </section>
  </section>
</main>

<script>
  // Protege el formulario si los módulos remotos no cargan en el navegador.
  // Sin este control, el envío HTML recarga la página y borra los campos.
  window.__pizzaLoginReady = false;
  const formularioSeguro = document.getElementById('formulario');
  const estadoAccesoSeguro = document.getElementById('errorAcceso');
  formularioSeguro.addEventListener('submit', (evento) => {
    evento.preventDefault();
    if (!window.__pizzaLoginReady) {
      estadoAccesoSeguro.textContent =
        'El sistema de acceso aún no cargó. Comprueba la conexión a Internet y actualiza la página. (carga de Firebase)';
    }
  }, true);
  window.addEventListener('load', () => {
    setTimeout(() => {
      if (!window.__pizzaLoginReady && !document.getElementById('acceso').hidden) {
        estadoAccesoSeguro.textContent =
          'No se pudo cargar Firebase en este navegador. Abre el enlace directamente en Chrome y revisa tu conexión.';
      }
    }, 3500);
  });
</script>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
  import { getFirestore, collection, onSnapshot, doc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: 'AIzaSyA65sFJq3vf24a-1VbpYBHCgpEAk--exAA',
    authDomain: 'pizzadejuank.firebaseapp.com',
    projectId: 'pizzadejuank',
    storageBucket: 'pizzadejuank.appspot.com',
    messagingSenderId: '856650093973',
    appId: '1:856650093973:web:a4cd3ad8e863617706d29c'
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

    const acceso = document.getElementById('acceso');
  const panel = document.getElementById('panel');
  const estado = document.getElementById('estado');
  const lista = document.getElementById('lista');
  let detenerEscucha = () => {};
  let alarmaActiva = false;
  let hayNuevos = false;
  let audio;
  let marcoCargado = false;
  let observadorMarco;

  const tabPedidos = document.getElementById('tab-pedidos');
  const tabProductos = document.getElementById('tab-productos');
  const vistaPedidos = document.getElementById('vista-pedidos');
  const vistaProductos = document.getElementById('vista-productos');
  const marcoProductos = document.getElementById('marco-productos');

  function cambiarVista(nombre) {
    const mostrarPedidos = nombre === 'pedidos';
    vistaPedidos.hidden = !mostrarPedidos;
    vistaProductos.hidden = mostrarPedidos;
    tabPedidos.setAttribute('aria-selected', String(mostrarPedidos));
    tabProductos.setAttribute('aria-selected', String(!mostrarPedidos));
    if (!mostrarPedidos && !marcoCargado) {
      marcoCargado = true;
      marcoProductos.src = 'admin-productos.html?integrado=1';
    }
  }
  tabPedidos.addEventListener('click', () => cambiarVista('pedidos'));
  tabProductos.addEventListener('click', () => cambiarVista('productos'));

  // El iframe es del mismo sitio. Ajustar su altura evita dos barras de desplazamiento.
  marcoProductos.addEventListener('load', () => {
    try {
      observadorMarco?.disconnect();
      const interno = marcoProductos.contentDocument;
      if (!interno) return;
      const ajustar = () => {
        const alto = Math.max(interno.body?.scrollHeight || 0, interno.documentElement?.scrollHeight || 0, 700);
        marcoProductos.style.height = (alto + 20) + 'px';
      };
      ajustar();
      observadorMarco = new ResizeObserver(ajustar);
      if (interno.body) observadorMarco.observe(interno.body);
      // Los cambios dinámicos de productos también se reflejan en la altura.
      const mutaciones = new MutationObserver(ajustar);
      if (interno.body) mutaciones.observe(interno.body, { childList:true, subtree:true, attributes:true });
      marcoProductos.addEventListener('load', () => mutaciones.disconnect(), {once:true});
    } catch (e) {
      // Si el contenido no está disponible, el iframe conserva altura mínima.
    }
  });

  document.getElementById('formulario').addEventListener('submit', async (e) => {
    e.preventDefault();
    const indicador = document.getElementById('errorAcceso');
    const boton = document.querySelector('#formulario button[type="submit"]');
    indicador.textContent = 'Verificando acceso con Firebase...';
    boton.disabled = true;
    try {
      await signInWithEmailAndPassword(auth,
        document.getElementById('correo').value.trim(),
        document.getElementById('clave').value);
      document.getElementById('clave').value = '';
      indicador.textContent = '';
    } catch (error) {
      const codigo = String(error?.code || 'error-desconocido');
      const mensajes = {
        'auth/invalid-credential': 'Firebase no acepta este correo y contraseña. Revisa la cuenta del administrador.',
        'auth/wrong-password': 'La contraseña no coincide con el administrador.',
        'auth/user-not-found': 'No existe ese usuario en Firebase Authentication.',
        'auth/invalid-email': 'El correo no tiene un formato válido.',
        'auth/network-request-failed': 'No hay conexión con Firebase. Revisa Internet.',
        'auth/too-many-requests': 'Firebase bloqueó temporalmente los intentos. No sigas probando la contraseña por ahora.',
        'auth/user-disabled': 'El usuario administrador está deshabilitado en Firebase.',
        'auth/operation-not-allowed': 'El inicio con correo y contraseña está deshabilitado en Firebase.',
        'auth/unauthorized-domain': 'El dominio de la página no está autorizado en Firebase.',
        'auth/invalid-api-key': 'La configuración de Firebase requiere revisión.',
        'auth/web-storage-unsupported': 'El navegador está bloqueando el almacenamiento de la sesión.'
      };
      indicador.textContent = (mensajes[codigo] || 'Firebase no pudo completar el inicio de sesión.') + ' Código: ' + codigo;
      console.warn('Error de acceso Firebase:', codigo);
    } finally {
      boton.disabled = false;
    }
  });
  window.__pizzaLoginReady = true;

  document.getElementById('salir').addEventListener('click', () => signOut(auth));

  document.getElementById('activar').addEventListener('click', async () => {
    try {
      audio ??= new (window.AudioContext || window.webkitAudioContext)();
      await audio.resume();
      alarmaActiva = true;
      document.getElementById('activar').textContent = '🔔 Alarma activada';
      if (hayNuevos) sonar();
    } catch (error) {
      estado.textContent = 'No se pudo activar el sonido.';
    }
  });

  function sonar() {
    if (!alarmaActiva || !audio || audio.state !== 'running') return;
    const inicio = audio.currentTime;
    for (let i = 0; i < 3; i++) {
      const tono = audio.createOscillator();
      const volumen = audio.createGain();
      tono.type = 'square';
      tono.frequency.value = i === 1 ? 740 : 950;
      volumen.gain.setValueAtTime(0, inicio + i * 0.3);
      volumen.gain.linearRampToValueAtTime(0.2, inicio + i * 0.3 + 0.02);
      volumen.gain.linearRampToValueAtTime(0, inicio + i * 0.3 + 0.24);
      tono.connect(volumen).connect(audio.destination);
      tono.start(inicio + i * 0.3);
      tono.stop(inicio + i * 0.3 + 0.25);
    }
  }

  setInterval(() => {
    if (hayNuevos) sonar();
  }, 3500);

  function linea(texto) {
    const p = document.createElement('p');
    p.className = 'dato';
    p.textContent = texto;
    return p;
  }

  function pintar(documentos) {
    lista.replaceChildren();

    const pedidos = documentos.filter(
      x => String(x.d.estado || '').toLowerCase() !== 'prueba'
    );

    pedidos.sort((a, b) =>
      (b.d.creadoEn?.seconds || 0) - (a.d.creadoEn?.seconds || 0)
    );

    hayNuevos = pedidos.some(
      x => String(x.d.estado || 'nuevo').toLowerCase() === 'nuevo'
    );

    const cuantosNuevos = pedidos.filter(x =>
      String(x.d.estado || 'nuevo').toLowerCase() === 'nuevo'
    ).length;
    document.getElementById('nuevos-tab').textContent = String(cuantosNuevos);
    document.getElementById('nuevos-tab').hidden = !cuantosNuevos;

    document.getElementById('contador').textContent =
      `${pedidos.length} pedido(s) · ${
        pedidos.filter(x =>
          String(x.d.estado || 'nuevo').toLowerCase() === 'nuevo'
        ).length
      } nuevo(s)`;

    estado.textContent = hayNuevos
      ? '🔔 Hay pedidos pendientes de confirmar'
      : 'Sin pedidos nuevos';

    if (!pedidos.length) {
      lista.append(linea('Todavía no hay pedidos reales.'));
    }

    for (const { id, d } of pedidos) {
      const nuevo =
        String(d.estado || 'nuevo').toLowerCase() === 'nuevo';

      const tarjeta = document.createElement('article');
      tarjeta.className = 'pedido' + (nuevo ? ' nuevo' : '');

      const titulo = document.createElement('h2');
      titulo.textContent =
        `Pedido ${id.slice(0, 8)} · ${
          nuevo ? 'NUEVO' : d.estado || 'Pendiente'
        }`;
      tarjeta.append(titulo);

      const cliente =
        typeof d.cliente === 'object' && d.cliente !== null
          ? d.cliente
          : {};

      tarjeta.append(linea(
        'Cliente: ' +
        (cliente.nombre || d.nombre || d.clienteNombre || 'Sin nombre')
      ));

      tarjeta.append(linea(
        'Teléfono: ' + (cliente.telefono || d.telefono || 'Sin teléfono')
      ));

      tarjeta.append(linea(
        'Entrega: ' + (d.modalidad || d.tipoEntrega || 'Sin especificar')
      ));

      tarjeta.append(linea(
        'Dirección: ' + (d.direccion || cliente.direccion || 'No indicada')
      ));

      tarjeta.append(linea(
        'Municipio: ' + (d.municipio || cliente.municipio || 'No indicado')
      ));

      const detalle = document.createElement('div');
      detalle.className = 'productos';
      detalle.textContent =
        'Productos: ' +
        JSON.stringify(d.productos || d.items || d.pizza || [], null, 2);
      tarjeta.append(detalle);

      tarjeta.append(linea(
        'Total: ' +
        (d.total == null
          ? 'Por confirmar'
          : '$' + Number(d.total).toLocaleString('es-CO'))
      ));

      if (nuevo) {
        const boton = document.createElement('button');
        boton.textContent = '✅ Confirmar recepción';

        boton.addEventListener('click', async () => {
          boton.disabled = true;
          try {
            await updateDoc(doc(db, 'pedidos', id), {
              estado: 'recibido',
              recibidoEn: serverTimestamp()
            });
          } catch (e) {
            estado.textContent =
              'No se pudo confirmar: revisa los permisos de Firestore.';
            boton.disabled = false;
          }
        });

        tarjeta.append(boton);
      }

      lista.append(tarjeta);
    }

    if (hayNuevos) sonar();
  }

  onAuthStateChanged(auth, (user) => {
    detenerEscucha();

    acceso.hidden = !!user;
    panel.hidden = !user;

    if (!user) {
      cambiarVista('pedidos');
      document.getElementById('nuevos-tab').hidden = true;
      alarmaActiva = false;
      hayNuevos = false;
      document.getElementById('activar').textContent =
        '🔔 Activar alarma sonora';
      return;
    }

    document.getElementById('usuario').textContent =
      'Sesión: ' + user.email;

    estado.textContent = 'Conectando con Firestore...';

    detenerEscucha = onSnapshot(
      collection(db, 'pedidos'),
      (snapshot) => pintar(
        snapshot.docs.map(x => ({
          id: x.id,
          d: x.data()
        }))
      ),
      () => {
        hayNuevos = false;
        estado.textContent =
          'Acceso a pedidos bloqueado. Falta configurar reglas de Firestore para tu usuario administrador.';
      }
    );
  });
</script>
</body>
</html>
